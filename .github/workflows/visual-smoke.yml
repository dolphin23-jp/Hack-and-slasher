name: Visual smoke

on:
  pull_request:
  push:
    branches:
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          # Hosted runners sometimes carry third-party APT feeds that can fail
          # independently of this project. These packages all come from Ubuntu.
          grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y xvfb unzip libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libudev1 libfontconfig1

      - name: Install Godot 4.5.1
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Import project and check resources
        run: |
          mkdir -p test-artifacts/ui
          set -o pipefail
          timeout 90s /tmp/godot/godot --headless --audio-driver Dummy --path . --editor --quit 2>&1 | tee test-artifacts/import.log

      - name: Run 43-check gameplay regression
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/godot --verbose --headless --audio-driver Dummy --path . -- --test --qa \
            2>&1 | tee test-artifacts/qa.log

      - name: Run ten-room basic-combat campaign
        run: |
          set -o pipefail
          timeout 180s /tmp/godot/godot --verbose --headless --audio-driver Dummy --path . -- --test --campaign \
            2>&1 | tee test-artifacts/campaign.log

      - name: Render and click through UI
        if: always()
        run: |
          set -o pipefail
          timeout 90s xvfb-run -a -s "-screen 0 1440x900x24" \
            /tmp/godot/godot --audio-driver Dummy --path . --script res://tests/visual_runner.gd -- --test \
            2>&1 | tee test-artifacts/visual.log

      - name: Fail on resource leak warnings
        if: always()
        run: |
          if grep -E "ObjectDB instances leaked|resources still in use at exit|RID allocations|WARNING:.*leak" test-artifacts/*.log; then
            echo "Resource leak warning detected."
            exit 1
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: test-artifacts/
          if-no-files-found: error
