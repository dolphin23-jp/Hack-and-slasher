name: Deploy Web to Pages

on:
  workflow_run:
    workflows:
      - Web build
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run's branch filter matches the triggering run's head branch name, which a
    # fork pull request can also call "main". Only deploy runs of this repository's own
    # main branch that came from a push or a manual dispatch.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified Web artifact
        uses: actions/download-artifact@v5
        with:
          name: ashen-vow-web
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify deploy payload
        run: |
          set -euxo pipefail
          test -s dist/web/index.html
          test -s dist/web/index.wasm
          test -s dist/web/index.pck
          manifest="$(find dist/web -maxdepth 1 -type f \( -name '*.manifest.json' -o -name 'manifest.json' \) -print -quit)"
          service_worker="$(find dist/web -maxdepth 1 -type f -name '*.service.worker.js' -print -quit)"
          test -n "$manifest"
          test -n "$service_worker"
          test -s "$manifest"
          test -s "$service_worker"

      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; deploying verified Web/PWA artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages is not enabled yet"
              echo
              echo "The verified Web/PWA artifact is ready, but the repository Pages site must be enabled once in **Settings → Pages → Source: GitHub Actions**."
              echo "After that one-time setting, the next successful main Web build will deploy automatically."
              echo
              echo "Pages API returned HTTP $status."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
